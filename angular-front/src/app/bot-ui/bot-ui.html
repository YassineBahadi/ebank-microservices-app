<div class="p-3">
    <div class="card-body">
        <input [(ngModel)]="query" type="text" class="form-control" style="display: inline; width: 90%;" placeholder="Search..." />
        <button  class="btn btn-primary" style="display: inline; width: 4%; margin-left: 2%;" (click)="askAgent()">
            <i class="bi bi-search"></i>
        </button>
         @if(loadingService.isLoading()){
        <div class="spinner-border text-success" role="status">
  <span class="visually-hidden">Loading...</span>
</div>
    }
    </div>
    <div class="card-body">
        @if(response$ | async ; as botResponse){
            <markdown [data]="botResponse" ></markdown>
        }
    </div>
</div>
